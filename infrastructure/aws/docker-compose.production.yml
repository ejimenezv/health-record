version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: medrecord-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medrecord}
      POSTGRES_USER: ${POSTGRES_USER:-medrecord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - medrecord-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medrecord}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: medrecord-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - medrecord-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ChromaDB Vector Store
  chromadb:
    image: chromadb/chroma:latest
    container_name: medrecord-chromadb
    restart: unless-stopped
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      CHROMA_SERVER_AUTH_CREDENTIALS: ${CHROMA_AUTH_TOKEN}
      CHROMA_SERVER_AUTH_PROVIDER: token
    networks:
      - medrecord-network
    ports:
      - "8001:8000"

  # AI Service
  ai-service:
    image: medrecord-ai-service:latest
    container_name: medrecord-ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-medrecord}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-medrecord}

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # ChromaDB
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      CHROMA_AUTH_TOKEN: ${CHROMA_AUTH_TOKEN}

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      # App settings
      API_ENV: production
      DEBUG: "false"
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-50}
    volumes:
      - ai-logs:/app/logs
    networks:
      - medrecord-network
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend (Node.js) - WebSocket Gateway for Real-Time Streaming
  backend:
    image: medrecord-backend:latest
    container_name: medrecord-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medrecord}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-medrecord}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_WS_URL: ws://ai-service:8000/ws
      JWT_SECRET: ${JWT_SECRET_KEY}
      NODE_ENV: production
      # Real-time streaming settings
      WEBSOCKET_PING_INTERVAL: ${WEBSOCKET_PING_INTERVAL:-30000}
      WEBSOCKET_MAX_CONNECTIONS: ${WEBSOCKET_MAX_CONNECTIONS:-100}
    networks:
      - medrecord-network
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (React)
  frontend:
    image: medrecord-frontend:latest
    container_name: medrecord-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: https://${DOMAIN_NAME}/api
      NODE_ENV: production
    networks:
      - medrecord-network
    ports:
      - "3000:80"

networks:
  medrecord-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  chroma-data:
  ai-logs:
